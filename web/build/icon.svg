<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="80" fill="url(#bg)" stroke="url(#accent)" stroke-width="4"/>

  <!-- Circuit traces -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <line x1="100" y1="256" x2="180" y2="256"/>
    <line x1="332" y1="256" x2="412" y2="256"/>
    <line x1="256" y1="170" x2="256" y2="200"/>
    <line x1="256" y1="312" x2="256" y2="342"/>
    <line x1="412" y1="256" x2="412" y2="160"/>
    <line x1="100" y1="256" x2="100" y2="350"/>
  </g>

  <!-- ALU trapezoid (center) -->
  <polygon points="180,210 180,302 332,285 332,225" fill="#2e1065" stroke="#a855f7" stroke-width="3"/>
  <text x="256" y="264" text-anchor="middle" fill="#e9d5ff" font-size="36" font-weight="bold" font-family="monospace">ALU</text>

  <!-- Register boxes -->
  <rect x="60" y="140" width="80" height="40" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
  <text x="100" y="166" text-anchor="middle" fill="#60a5fa" font-size="18" font-weight="bold" font-family="monospace">R0</text>

  <rect x="372" y="140" width="80" height="40" rx="8" fill="#111827" stroke="#3b82f6" stroke-width="2"/>
  <text x="412" y="166" text-anchor="middle" fill="#60a5fa" font-size="18" font-weight="bold" font-family="monospace">R1</text>

  <!-- RAM box -->
  <rect x="60" y="330" width="80" height="40" rx="8" fill="#111827" stroke="#ef4444" stroke-width="2"/>
  <text x="100" y="356" text-anchor="middle" fill="#f87171" font-size="18" font-weight="bold" font-family="monospace">RAM</text>

  <!-- Bus line -->
  <rect x="60" y="400" width="392" height="8" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>

  <!-- Dots on bus -->
  <circle cx="100" cy="404" r="6" fill="#3b82f6"/>
  <circle cx="256" cy="404" r="6" fill="#a855f7"/>
  <circle cx="412" cy="404" r="6" fill="#ef4444"/>

  <!-- Connection lines to bus -->
  <line x1="100" y1="370" x2="100" y2="400" stroke="#334155" stroke-width="2"/>
  <line x1="256" y1="342" x2="256" y2="400" stroke="#334155" stroke-width="2"/>
  <line x1="412" y1="180" x2="412" y2="400" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="256" y="468" text-anchor="middle" fill="#64748b" font-size="32" font-weight="bold" font-family="sans-serif" letter-spacing="4">GATESTACK</text>
</svg>
